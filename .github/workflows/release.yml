name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Prepare release archive
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css README.md LICENSE dist/
          cd dist
          zip -r "../ai-reading-companion-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-reading-companion-${{ github.ref_name }}.zip
          generate_release_notes: true
